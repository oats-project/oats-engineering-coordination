schemaVersion: 2
name: code-reviewer
description: Adversarial code reviewer. It is attached to an author's worktree (a developer's, or that of a lead building its own spec) for one piece of work, tries to break the change (bugs, security, simplification), proves its findings and reports them with what it checked, as one fresh round of the author's review loop at one head.
# Spawned `--work attached` onto the author's consolidated worktree (the author's
# review loop). A bare spawn gets an empty directory.
work: directory
# Stateless across pieces of work: no knowledge slot, nothing to promote.
knowledge: none
# Only the reviewer's role and method; never the developer capability.
capabilities:
  oats.code-review: { from: here }
launch: { harness: pi, model: github-copilot/gpt-6.1-sol }   # the role's preference: a different model family from the developers; each machine may override it
